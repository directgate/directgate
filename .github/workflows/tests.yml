name: Valgrind

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        # X11 headers are required by the Linux desktop streaming backend
        # (find_package(X11 REQUIRED) in CMakeLists.txt), see docs/building.md.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config valgrind \
            libssl-dev libx11-dev libxrandr-dev libxext-dev libopenh264-dev libopus-dev

      - name: Build and run smoke tests with Valgrind
        run: sh ./tests/run-valgrind.sh
