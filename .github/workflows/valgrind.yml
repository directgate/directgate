name: Valgrind

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config valgrind \
            libssl-dev libx11-dev libxrandr-dev libxext-dev libopenh264-dev libopus-dev \
            libavcodec-dev libavutil-dev

      - name: Build and run tests with Valgrind
        run: sh ./tests/run-valgrind.sh
