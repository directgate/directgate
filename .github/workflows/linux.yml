name: Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      # X11 headers are required by the Linux desktop streaming backend
      # (find_package(X11 REQUIRED) in CMakeLists.txt), see docs/building.md.
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential pkg-config \
          libssl-dev libx11-dev libxrandr-dev libxext-dev

    - name: Configure
      run: cmake -B build

    - name: Build
      run: cmake --build build -j"$(nproc)"
